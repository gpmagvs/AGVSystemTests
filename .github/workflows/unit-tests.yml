name: Unit Tests

on:
  workflow_call:
    inputs:
      source_repo:
        description: "Repo that triggered the run (e.g. gpmagvs/AGVSystem)"
        type: string
        required: false
        default: "gpmagvs/AGVSystem"
      source_ref:
        description: "Ref (branch/tag) from source repo (e.g. develop)"
        type: string
        required: false
        default: "develop"
      source_sha:
        description: "Commit SHA from source repo (preferred when provided)"
        type: string
        required: false
      tests_ref:
        description: "Ref of gpmagvs/AGVSystemTests to checkout"
        type: string
        required: false
        default: "master"
    secrets:
      AGVSYSTEM_CHECKOUT_TOKEN:
        description: "Token to checkout private gpmagvs/AGVSystem (contents:read)."
        required: false

  repository_dispatch:
    types: [run-unit-tests]

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repo that triggered the run (e.g. gpmagvs/AGVSystem)"
        type: string
        required: false
        default: "gpmagvs/AGVSystem"
      source_ref:
        description: "Ref (branch/tag) from source repo (e.g. develop)"
        type: string
        required: false
        default: "develop"
      source_sha:
        description: "Commit SHA from source repo (preferred when provided)"
        type: string
        required: false
      tests_ref:
        description: "Ref of gpmagvs/AGVSystemTests to checkout"
        type: string
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  unit-tests:
    name: dotnet test
    runs-on: ubuntu-latest
    env:
      AGVSYSTEM_CHECKOUT_TOKEN: ${{ secrets.AGVSYSTEM_CHECKOUT_TOKEN }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "AGVS_UT_Sql!Passw0rd"
        ports:
          - 1433:1433

    steps:
      - name: Resolve inputs / payload + defaults
        shell: bash
        run: |
          set -euo pipefail

          # NOTE:
          # - For reusable workflow usage, github.event_name is the caller event (push/pull_request/etc).
          # - Except for repository_dispatch, always read from `inputs.*` (available for workflow_call and workflow_dispatch).
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            source_repo='${{ github.event.client_payload.source_repo }}'
            source_ref='${{ github.event.client_payload.source_ref }}'
            source_sha='${{ github.event.client_payload.source_sha }}'
            tests_ref='${{ github.event.client_payload.tests_ref }}'
          else
            source_repo='${{ inputs.source_repo }}'
            source_ref='${{ inputs.source_ref }}'
            source_sha='${{ inputs.source_sha }}'
            tests_ref='${{ inputs.tests_ref }}'
          fi

          : "${source_repo:=gpmagvs/AGVSystem}"
          : "${source_ref:=develop}"
          : "${source_sha:=}"
          : "${tests_ref:=master}"

          {
            echo "SOURCE_REPO=$source_repo"
            echo "SOURCE_REF=$source_ref"
            echo "SOURCE_SHA=$source_sha"
          } >> "$GITHUB_ENV"

          if [[ -n "$source_sha" ]]; then
            echo "CHECKOUT_REF=$source_sha" >> "$GITHUB_ENV"
          else
            echo "CHECKOUT_REF=$source_ref" >> "$GITHUB_ENV"
          fi

          echo "TESTS_REF=$tests_ref" >> "$GITHUB_ENV"

          choose_ref() {
            local repo="$1"
            if [[ "$repo" == "$source_repo" ]]; then
              echo "${source_sha:-$source_ref}"
            else
              echo "develop"
            fi
          }

          echo "AGVS_REF=$(choose_ref gpmagvs/AGVSystem)" >> "$GITHUB_ENV"
          echo "COMMON_REF=$(choose_ref gpmagvs/AGVSystemCommonNet6)" >> "$GITHUB_ENV"
          echo "EQUIP_REF=$(choose_ref gpmagvs/EquipmentManagment)" >> "$GITHUB_ENV"
          echo "VMS_REF=$(choose_ref gpmagvs/VMSystem)" >> "$GITHUB_ENV"

          echo "AGVS_TEST_SQL_SERVER=127.0.0.1" >> "$GITHUB_ENV"
          echo "AGVS_TEST_SQL_USER=sa" >> "$GITHUB_ENV"
          echo "AGVS_TEST_SQL_PASSWORD=AGVS_UT_Sql!Passw0rd" >> "$GITHUB_ENV"

      - name: Show resolved inputs
        shell: bash
        run: |
          echo "SOURCE_REPO=$SOURCE_REPO"
          echo "SOURCE_REF=$SOURCE_REF"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "CHECKOUT_REF=$CHECKOUT_REF"
          echo "TESTS_REF=$TESTS_REF"
          echo "AGVS_REF=$AGVS_REF"
          echo "COMMON_REF=$COMMON_REF"
          echo "EQUIP_REF=$EQUIP_REF"
          echo "VMS_REF=$VMS_REF"

      - name: Preflight (private repo checkout)
        shell: bash
        run: |
          if [[ -n "${AGVSYSTEM_CHECKOUT_TOKEN:-}" ]]; then
            exit 0
          fi

          cat <<'MSG'
          ::error::缺少 secrets.AGVSYSTEM_CHECKOUT_TOKEN，無法 checkout 其它 sibling repo。

          這個 workflow 會為了滿足 `AGVSystemTests.csproj` 的 ProjectReference，checkout 以下四個 sibling repo 到固定路徑：
          - gpmagvs/AGVSystem → ./AGVSystem
          - gpmagvs/AGVSystemCommonNet6 → ./AGVSystemCommonNet6
          - gpmagvs/EquipmentManagment → ./EquipmentManagment
          - gpmagvs/VMSystem → ./VMSystem

          但 GitHub Actions 的 GITHUB_TOKEN **無法跨 repo** 讀取其它 private repo（caller repo 以外的 repo 通常會回 404：Repository not found）。
          例如近期失敗 log 會看到類似：
          - env AGVSYSTEM_CHECKOUT_TOKEN is EMPTY
          - fatal: repository 'https://github.com/gpmagvs/AGVSystem/' not found

          請在呼叫端 workflow（例如 gpmagvs/AGVSystem*）傳入 `secrets.AGVSYSTEM_CHECKOUT_TOKEN`：
          - 需可讀取以上四個 repo（fine-grained PAT / GitHub App token，至少 contents:read）

          ---

          ::error::Missing secrets.AGVSYSTEM_CHECKOUT_TOKEN; cannot checkout other sibling repos.

          This workflow must checkout these sibling repos to satisfy `AGVSystemTests.csproj` ProjectReferences:
          - gpmagvs/AGVSystem → ./AGVSystem
          - gpmagvs/AGVSystemCommonNet6 → ./AGVSystemCommonNet6
          - gpmagvs/EquipmentManagment → ./EquipmentManagment
          - gpmagvs/VMSystem → ./VMSystem

          The default GITHUB_TOKEN typically cannot read other private repos across the org, which results in misleading 404 “Repository not found”.

          Fix: pass `secrets.AGVSYSTEM_CHECKOUT_TOKEN` from the caller workflow (fine-grained PAT / GitHub App token with at least contents:read to the 4 repos above).
          MSG
          exit 1

      - name: Checkout this repo (AGVSystemTests)
        uses: actions/checkout@v4
        with:
          repository: gpmagvs/AGVSystemTests
          ref: ${{ env.TESTS_REF }}
          path: AGVSystemTests

      # Required sibling layout for ProjectReference paths:
      #   AGVSystem/
      #   AGVSystemCommonNet6/
      #   EquipmentManagment/
      #   VMSystem/
      #   AGVSystemTests/

      # PAT-free checkout for the caller repo, but always into the correct folder path.
      - name: Checkout AGVSystem (caller) - PAT free
        if: ${{ github.repository == 'gpmagvs/AGVSystem' }}
        uses: actions/checkout@v4
        with:
          path: AGVSystem
          ref: ${{ env.AGVS_REF }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout AGVSystemCommonNet6 (caller) - PAT free
        if: ${{ github.repository == 'gpmagvs/AGVSystemCommonNet6' }}
        uses: actions/checkout@v4
        with:
          path: AGVSystemCommonNet6
          ref: ${{ env.COMMON_REF }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout EquipmentManagment (caller) - PAT free
        if: ${{ github.repository == 'gpmagvs/EquipmentManagment' }}
        uses: actions/checkout@v4
        with:
          path: EquipmentManagment
          ref: ${{ env.EQUIP_REF }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout VMSystem (caller) - PAT free
        if: ${{ github.repository == 'gpmagvs/VMSystem' }}
        uses: actions/checkout@v4
        with:
          path: VMSystem
          ref: ${{ env.VMS_REF }}
          fetch-depth: 0
          submodules: recursive

      # Non-caller sibling checkouts. Require explicit token; never fall back to caller GITHUB_TOKEN.
      - name: Checkout AGVSystem (non-caller) - with token
        if: ${{ github.repository != 'gpmagvs/AGVSystem' && env.AGVSYSTEM_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: gpmagvs/AGVSystem
          path: AGVSystem
          ref: ${{ env.AGVS_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.AGVSYSTEM_CHECKOUT_TOKEN }}

      - name: Checkout AGVSystemCommonNet6 (non-caller) - with token
        if: ${{ github.repository != 'gpmagvs/AGVSystemCommonNet6' && env.AGVSYSTEM_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: gpmagvs/AGVSystemCommonNet6
          path: AGVSystemCommonNet6
          ref: ${{ env.COMMON_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.AGVSYSTEM_CHECKOUT_TOKEN }}

      - name: Checkout EquipmentManagment (non-caller) - with token
        if: ${{ github.repository != 'gpmagvs/EquipmentManagment' && env.AGVSYSTEM_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: gpmagvs/EquipmentManagment
          path: EquipmentManagment
          ref: ${{ env.EQUIP_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.AGVSYSTEM_CHECKOUT_TOKEN }}

      - name: Checkout VMSystem (non-caller) - with token
        if: ${{ github.repository != 'gpmagvs/VMSystem' && env.AGVSYSTEM_CHECKOUT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: gpmagvs/VMSystem
          path: VMSystem
          ref: ${{ env.VMS_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.AGVSYSTEM_CHECKOUT_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate referenced projects exist
        shell: bash
        run: |
          set -euo pipefail
          csproj="AGVSystemTests/AGVSystemTests.csproj"
          if [[ ! -f "$csproj" ]]; then
            echo "::error::Missing $csproj"
            exit 1
          fi

          missing=0
          while IFS= read -r ref; do
            ref="${ref//\\//}"
            path="AGVSystemTests/$ref"
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing ProjectReference target: $path"
              missing=1
            fi
          done < <(grep -oP '<ProjectReference Include="\\K[^"]+' "$csproj" || true)

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::One or more ProjectReference files are missing. Ensure the source repo checkout contains these sibling projects at the workspace root."
            exit 1
          fi

      - name: Wait for SQL Server port
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server port is open."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not open port 1433 in time."
          exit 1

      - name: Restore
        shell: bash
        run: dotnet restore AGVSystemTests/AGVSystemTests.csproj

      - name: Test
        shell: bash
        run: dotnet test AGVSystemTests/AGVSystemTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
