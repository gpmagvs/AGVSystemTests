name: Unit Tests

on:
  workflow_call:
    inputs:
      source_repo:
        description: "Repo that triggered the run (e.g. gpmagvs/AGVSystem)"
        type: string
        required: false
        default: "gpmagvs/AGVSystem"
      source_ref:
        description: "Ref (branch/tag) from source repo (e.g. develop)"
        type: string
        required: false
        default: "develop"
      source_sha:
        description: "Commit SHA from source repo (preferred when provided)"
        type: string
        required: false
    secrets:
      AGVSYSTEM_CHECKOUT_TOKEN:
        description: "Token to checkout private gpmagvs/AGVSystem (contents:read)."
        required: false

  repository_dispatch:
    types: [run-unit-tests]

  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repo that triggered the run (e.g. gpmagvs/AGVSystem)"
        type: string
        required: false
        default: "gpmagvs/AGVSystem"
      source_ref:
        description: "Ref (branch/tag) from source repo (e.g. develop)"
        type: string
        required: false
        default: "develop"
      source_sha:
        description: "Commit SHA from source repo (preferred when provided)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: dotnet test
    runs-on: ubuntu-latest
    env:
      AGVSYSTEM_CHECKOUT_TOKEN: ${{ secrets.AGVSYSTEM_CHECKOUT_TOKEN }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "AGVS_UT_Sql!Passw0rd"
        ports:
          - 1433:1433

    steps:
      - name: Resolve inputs / payload + defaults
        shell: bash
        run: |
          set -euo pipefail

          # NOTE:
          # - For reusable workflow usage, github.event_name is the caller event (push/pull_request/etc).
          # - Except for repository_dispatch, always read from `inputs.*` (available for workflow_call and workflow_dispatch).
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            source_repo='${{ github.event.client_payload.source_repo }}'
            source_ref='${{ github.event.client_payload.source_ref }}'
            source_sha='${{ github.event.client_payload.source_sha }}'
          else
            source_repo='${{ inputs.source_repo }}'
            source_ref='${{ inputs.source_ref }}'
            source_sha='${{ inputs.source_sha }}'
          fi

          : "${source_repo:=gpmagvs/AGVSystem}"
          : "${source_ref:=develop}"
          : "${source_sha:=}"

          {
            echo "SOURCE_REPO=$source_repo"
            echo "SOURCE_REF=$source_ref"
            echo "SOURCE_SHA=$source_sha"
          } >> "$GITHUB_ENV"

          if [[ -n "$source_sha" ]]; then
            echo "CHECKOUT_REF=$source_sha" >> "$GITHUB_ENV"
          else
            echo "CHECKOUT_REF=$source_ref" >> "$GITHUB_ENV"
          fi

          # Derive called workflow repo/ref to checkout AGVSystemTests correctly (even when caller repo differs).
          tests_repo="${GITHUB_WORKFLOW_REF%%/.github/workflows/*}"
          tests_ref="${GITHUB_WORKFLOW_REF##*@}"
          if [[ -z "$tests_repo" || "$tests_repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            tests_repo="gpmagvs/AGVSystemTests"
          fi
          if [[ -z "$tests_ref" || "$tests_ref" == "$GITHUB_WORKFLOW_REF" ]]; then
            tests_ref="master"
          fi
          {
            echo "TESTS_REPO=$tests_repo"
            echo "TESTS_REF=$tests_ref"
          } >> "$GITHUB_ENV"

          echo "AGVS_TEST_SQL_SERVER=127.0.0.1" >> "$GITHUB_ENV"
          echo "AGVS_TEST_SQL_USER=sa" >> "$GITHUB_ENV"
          echo "AGVS_TEST_SQL_PASSWORD=AGVS_UT_Sql!Passw0rd" >> "$GITHUB_ENV"

      - name: Show resolved inputs
        shell: bash
        run: |
          echo "SOURCE_REPO=$SOURCE_REPO"
          echo "SOURCE_REF=$SOURCE_REF"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "CHECKOUT_REF=$CHECKOUT_REF"
          echo "TESTS_REPO=$TESTS_REPO"
          echo "TESTS_REF=$TESTS_REF"

      - name: Preflight (private repo checkout)
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY}" == "${SOURCE_REPO}" ]]; then
            # PAT-free path (running inside the source repo).
            exit 0
          fi
          if [[ -n "${AGVSYSTEM_CHECKOUT_TOKEN:-}" ]]; then
            exit 0
          fi

          cat <<'MSG'
          ::error::無法 checkout 來源 repo：看起來你在 gpmagvs/AGVSystemTests 內直接執行此 workflow，但要 checkout 的 SOURCE_REPO 不是本 repo，而且沒有設定 secrets.AGVSYSTEM_CHECKOUT_TOKEN。

          這通常是因為 gpmagvs/AGVSystem 是 private repo，AGVSystemTests 的 GITHUB_TOKEN 沒有權限讀取，因此會出現「Repository not found (404)」。

          解法（二選一）：
          1) 推薦：在 gpmagvs/AGVSystem 的 develop push 觸發（workflow_call），讓 GITHUB_TOKEN 來自 AGVSystem（不需要 PAT）
          2) 或：在 gpmagvs/AGVSystemTests 設定 repo secret `AGVSYSTEM_CHECKOUT_TOKEN`（PAT / fine-grained token，至少 contents:read 可讀取 gpmagvs/AGVSystem）

          ---

          ::error::Cannot checkout source repo: this workflow is running in gpmagvs/AGVSystemTests, but SOURCE_REPO is different and secrets.AGVSYSTEM_CHECKOUT_TOKEN is not set.

          This usually means gpmagvs/AGVSystem is private and the AGVSystemTests GITHUB_TOKEN cannot read it (GitHub returns 404 “Repository not found”).

          Fix (choose one):
          1) Recommended: trigger via workflow_call from gpmagvs/AGVSystem (develop push) so the GITHUB_TOKEN belongs to AGVSystem (no PAT needed)
          2) Or: add repo secret `AGVSYSTEM_CHECKOUT_TOKEN` in gpmagvs/AGVSystemTests (PAT / fine-grained token with at least contents:read for gpmagvs/AGVSystem)
          MSG
          exit 1

      # Checkout AGVSystem first into workspace root, so AGVSystemTests can reference ../AGVSystem, ../VMSystem, etc.
      # Path A (PAT-free): when called from AGVSystem via workflow_call, github.repository == SOURCE_REPO.
      - name: Checkout source repo (AGVSystem) - PAT free (caller repo)
        if: ${{ github.repository == env.SOURCE_REPO }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          submodules: recursive

      # Path B: running in AGVSystemTests and checking out a different (likely private) repo requires an explicit token.
      - name: Checkout source repo (AGVSystem) - with explicit token
        if: ${{ github.repository != env.SOURCE_REPO }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ env.AGVSYSTEM_CHECKOUT_TOKEN }}

      - name: Checkout this repo (AGVSystemTests)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TESTS_REPO }}
          ref: ${{ env.TESTS_REF }}
          path: AGVSystemTests

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate referenced projects exist
        shell: bash
        run: |
          set -euo pipefail
          csproj="AGVSystemTests/AGVSystemTests.csproj"
          if [[ ! -f "$csproj" ]]; then
            echo "::error::Missing $csproj"
            exit 1
          fi

          missing=0
          while IFS= read -r ref; do
            ref="${ref//\\//}"
            path="AGVSystemTests/$ref"
            if [[ ! -f "$path" ]]; then
              echo "::error::Missing ProjectReference target: $path"
              missing=1
            fi
          done < <(grep -oP '<ProjectReference Include="\\K[^"]+' "$csproj" || true)

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::One or more ProjectReference files are missing. Ensure the source repo checkout contains these sibling projects at the workspace root."
            exit 1
          fi

      - name: Wait for SQL Server port
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server port is open."
              exit 0
            fi
            sleep 2
          done
          echo "::error::SQL Server did not open port 1433 in time."
          exit 1

      - name: Restore
        shell: bash
        run: dotnet restore AGVSystemTests/AGVSystemTests.csproj

      - name: Test
        shell: bash
        run: dotnet test AGVSystemTests/AGVSystemTests.csproj --configuration Release --no-restore --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx
