name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./AGVSystemTests.csproj

      - name: Build
        run: dotnet build ./AGVSystemTests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test ./AGVSystemTests.csproj -c Release --no-build

